<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patricia Nieto — Vídeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f2ec;
      --surface: #e9e6dd;
      --border: #d8d5cc;
      --text: #252622;
      --muted: #77786f;
      --accent: #b44f34;
      --cols: 3;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    body.preview-open { overflow: hidden; }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: min(1380px, calc(100% - 112px));
      height: 88px;
      margin-inline: auto;
      padding: 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
    }

    .logo {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      text-decoration: none;
    }

    .logo-name {
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.13em;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;
    }

    .logo-sub {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.01em;
      padding-bottom: 5px;
      border-bottom: 1px solid var(--border);
      text-decoration: none;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .back-link:hover { border-color: var(--accent); color: var(--accent); }
    .back-link span { color: var(--accent); font-size: 16px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
      gap: clamp(12px, 1.8vw, 24px);
      width: min(1500px, calc(100% - 112px));
      margin: 0 auto;
      padding: clamp(28px, 4vw, 56px) 0;
      flex: 1;
    }

    .site-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      width: min(1380px, calc(100% - 112px));
      min-height: 78px;
      margin: auto auto 0;
      border-top: 1px solid var(--border);
      color: var(--muted);
    }
    .footer-contact { color: var(--text); font-size: 12px; text-decoration: none; transition: color 0.2s ease; }
    .footer-contact:hover { color: var(--accent); }
    .footer-credit { display: flex; align-items: center; gap: 14px; }
    .footer-name { font-size: 12px; font-weight: 600; }
    .footer-note { font-size: 9px; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase; }

    .grid-item {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      overflow: hidden;
      padding: 0;
      border: 0;
      background: var(--surface);
      cursor: pointer;
      animation: fadeUp 0.45s ease both;
    }

    .grid-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .grid-item:hover img { transform: scale(1.035); }

    .grid-item:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    .preview {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(25, 25, 23, 0.94);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .preview.open {
      opacity: 1;
      pointer-events: auto;
    }

    .preview iframe {
      display: block;
      width: min(90vw, 1200px);
      height: min(86vh, 675px);
      border: 0;
      background: #000;
    }

    .preview iframe[data-orientation="portrait"] {
      width: min(48vh, 90vw);
      height: min(86vh, 900px);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 900px) { :root { --cols: 2; } }
    @media (max-width: 760px) {
      header, .grid { width: calc(100% - 48px); }
      .site-footer { width: calc(100% - 48px); }
    }
    @media (max-width: 520px) {
      :root { --cols: 1; }
      header { width: calc(100% - 36px); height: 76px; }
      .grid { width: calc(100% - 36px); gap: 18px; padding-top: 24px; }
      .site-footer { width: calc(100% - 36px); min-height: 70px; flex-wrap: wrap; padding-block: 18px; }
      .footer-credit { align-items: flex-end; flex-direction: column; gap: 4px; }
      .logo-name { font-size: 12px; letter-spacing: 0.1em; }
      .logo-sub { font-size: 7px; }
      .back-link { gap: 6px; font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    @media (max-width: 520px) {
      .preview { padding: 12px; }
      .preview iframe { width: 94vw; height: 82vh; }
      .preview iframe[data-orientation="portrait"] { width: min(48vh, 94vw); }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="index.html">
      <span class="logo-name">PATRICIA NIETO</span>
      <span class="logo-sub">Fotografía + vídeo</span>
    </a>
    <a class="back-link" href="index.html#proyectos"><span aria-hidden="true">←</span> Proyectos</a>
  </header>

  <main class="grid" aria-label="Vídeo">
    <button class="grid-item" type="button" data-video="videos/Pinko_AREA_1_1.mp4" data-orientation="portrait" aria-label="Reproducir vídeo Pinko AREA">
      <img src="videos/posters/Pinko_AREA.jpg" alt="" loading="lazy" />
    </button>
    <button class="grid-item" type="button" data-video="videos/InPostSF_1_1.mp4" aria-label="Reproducir vídeo InPost San Fernando">
      <img src="videos/posters/InPostSF.jpg" alt="" loading="lazy" />
    </button>
    <button class="grid-item" type="button" data-video="videos/InPost_ATM_cartelas.mp4" data-orientation="portrait" aria-label="Reproducir vídeo InPost ATM">
      <img src="videos/posters/InPost_ATM_cartelas.jpg" alt="" loading="lazy" />
    </button>
    <button class="grid-item" type="button" data-video="videos/Oktobertech2025_1_1_1.mp4" aria-label="Reproducir vídeo Oktobertech 2025">
      <img src="videos/posters/Oktobertech2025.jpg" alt="" loading="lazy" />
    </button>
    <button class="grid-item" type="button" data-video="videos/InesUrquijo_ElViajeroNavidad2025_1_1.mp4" data-orientation="portrait" aria-label="Reproducir vídeo El Viajero Navidad 2025">
      <img src="videos/posters/InesUrquijo_ElViajeroNavidad2025.jpg" alt="" loading="lazy" />
    </button>
    <button class="grid-item" type="button" data-video="videos/AREAInPostATM_2a.mp4" aria-label="Reproducir vídeo AREA InPost ATM">
      <img src="videos/posters/AREAInPostATM_2.jpg" alt="" loading="lazy" />
    </button>
    <button class="grid-item" type="button" data-video="videos/InPost_Atletico_1.mp4" aria-label="Reproducir vídeo InPost Atlético">
      <img src="videos/posters/InPost_Atletico.jpg" alt="" loading="lazy" />
    </button>
    <button class="grid-item" type="button" data-video="videos/InesUrquijo_2.mp4" data-orientation="portrait" aria-label="Reproducir vídeo Inés Urquijo">
      <img src="videos/posters/InesUrquijo_.jpg" alt="" loading="lazy" />
    </button>
    <button class="grid-item" type="button" data-video="videos/InPost%20Navidad_1_1_1.mp4" aria-label="Reproducir vídeo InPost Navidad">
      <img src="videos/posters/InPost%20Navidad.jpg" alt="" loading="lazy" />
    </button>
    <button class="grid-item" type="button" data-video="videos/InesUrquijo_BodaRest1.mp4" data-orientation="portrait" aria-label="Reproducir vídeo boda restaurante">
      <img src="videos/posters/InesUrquijo_BodaRest.jpg" alt="" loading="lazy" />
    </button>
  </main>
  <footer class="site-footer">
    <a class="footer-contact" href="mailto:patricianieto2.0@gmail.com">patricianieto2.0@gmail.com</a>
    <div class="footer-credit">
      <span class="footer-name">Patricia Nieto</span>
      <span class="footer-note">© 2026 · Fotografía + vídeo</span>
    </div>
  </footer>

  <div class="preview" id="preview" role="dialog" aria-modal="true" aria-label="Vista previa del vídeo" aria-hidden="true">
    <iframe id="preview-frame" title="Reproductor de vídeo" allow="autoplay; fullscreen"></iframe>
  </div>

  <script>
    const preview = document.getElementById('preview');
    const previewFrame = document.getElementById('preview-frame');
    const videoCards = document.querySelectorAll('.grid-item');

    function closePreview() {
      if (!preview.classList.contains('open')) return;
      preview.classList.remove('open');
      preview.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('preview-open');
      previewFrame.removeAttribute('src');
      previewFrame.removeAttribute('data-orientation');
    }

    videoCards.forEach((card) => {
      card.addEventListener('click', () => {
        previewFrame.src = card.dataset.video;
        previewFrame.title = card.getAttribute('aria-label');
        if (card.dataset.orientation) {
          previewFrame.dataset.orientation = card.dataset.orientation;
        }
        preview.classList.add('open');
        preview.setAttribute('aria-hidden', 'false');
        document.body.classList.add('preview-open');
      });
    });

    preview.addEventListener('click', (event) => {
      if (event.target === preview) closePreview();
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && preview.classList.contains('open')) {
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
