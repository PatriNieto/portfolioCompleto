<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f4f2ec" />
  <meta name="description" content="Portfolio de fotografía y vídeo de Patricia Nieto." />
  <title>Patricia Nieto — Fotografía y vídeo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f2ec;
      --surface: #e9e6dd;
      --text: #252622;
      --muted: #77786f;
      --accent: #b44f34;
      --line: #d8d5cc;
      --font-sans: "DM Sans", sans-serif;
      --font-serif: "DM Serif Display", serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 104px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    .wrap { width: min(1380px, calc(100% - 112px)); margin-inline: auto; }

    .skip-link {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      padding: 12px 16px;
      transform: translateY(-160%);
      background: var(--text);
      color: var(--bg);
    }
    .skip-link:focus { transform: translateY(0); }

    .site-header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 88px;
      padding-inline: clamp(24px, 5vw, 72px);
      border-bottom: 0;
      background: transparent;
      color: white;
      text-shadow: 0 1px 10px rgb(0 0 0 / 35%);
      transition: background-color .3s ease, border-color .3s ease, color .3s ease;
    }
    .site-header.is-scrolled {
      border-color: transparent;
      background: rgb(244 242 236 / 58%);
      color: var(--text);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      text-shadow: none;
    }
    .wordmark { display: inline-flex; flex-direction: column; gap: 4px; text-decoration: none; }
    .wordmark-name { font-size: 14px; font-weight: 700; letter-spacing: .13em; }
    .wordmark-caption, .nav-link, .eyebrow, .footer-note {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .wordmark-caption { color: var(--muted); }
    .site-header:not(.is-scrolled) .wordmark-caption { color: rgb(255 255 255 / 82%); }
    .nav-link {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: white;
      font-size: 12px;
      letter-spacing: .01em;
      text-decoration: none;
      transition: color .2s ease;
      text-transform: none;
    }
    .site-header.is-scrolled .nav-link { color: var(--text); }
    .site-header.is-scrolled .nav-link:hover, .nav-link:hover { color: var(--accent); }
    .site-nav { display: flex; align-items: center; gap: clamp(22px, 3vw, 42px); }
    .hero {
      position: relative;
      width: 100%;
      padding: 0;
    }
    .hero-image {
      position: relative;
      min-width: 0;
      height: 100svh;
      min-height: 560px;
      overflow: hidden;
      background: var(--surface);
      animation: image-enter 1s cubic-bezier(.2, .65, .3, 1) both;
    }
    @keyframes image-enter {
      from { opacity: .8; transform: scale(1.02); }
      to { opacity: 1; transform: scale(1); }
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .hero-image img, .project-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-image img { position: absolute; inset: 0; }
    .hero-slide {
      opacity: 0;
      transition: opacity 1.4s ease-in-out;
    }
    .hero-slide.is-active { opacity: 1; }
    .projects { padding-block: 64px 120px; }
    .project-grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 42px 24px; }
    .project-card {
      grid-column: span 4;
      min-width: 0;
      text-decoration: none;
      animation: project-enter .6s cubic-bezier(.2, .65, .3, 1) both;
    }
    .project-card:nth-child(2) { animation-delay: .06s; }
    .project-card:nth-child(3) { animation-delay: .12s; }
    .project-card:nth-child(4) { animation-delay: .18s; }
    .project-card:nth-child(5) { animation-delay: .24s; }
    @keyframes project-enter {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .project-card:nth-child(1) { grid-column: span 7; }
    .project-card:nth-child(2) { grid-column: span 5; }
    .project-card:nth-child(3) { grid-column: span 5; }
    .project-card:nth-child(4) { grid-column: span 4; }
    .project-card:nth-child(5) { grid-column: span 3; }
    .project-image {
      position: relative;
      overflow: hidden;
      aspect-ratio: 1.32;
      background: var(--surface);
    }
    .project-card:nth-child(1) .project-image,
    .project-card:nth-child(2) .project-image { aspect-ratio: 1.48; }
    .project-image img { transition: transform .65s cubic-bezier(.2, .65, .3, 1); }
    .project-card:hover .project-image img { transform: scale(1.045); }
    .project-details {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-top: 14px;
    }
    .project-title { font-size: clamp(19px, 2vw, 25px); font-weight: 500; letter-spacing: -.04em; }
    .project-arrow { color: var(--accent); font-size: 20px; transition: transform .2s ease; }
    .project-card:hover .project-arrow { transform: translate(3px, -3px); }

    .site-footer {
      width: 100%;
      padding: clamp(36px, 6vw, 80px) clamp(24px, 5vw, 72px) 24px;
      background: var(--text);
      color: var(--bg);
    }
    .footer-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      max-width: 1500px;
      margin: 0 auto 24px;
      color: rgb(244 242 236 / 68%);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
    .footer-contact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      max-width: 1500px;
      margin: 0 auto;
      color: var(--bg);
      font-size: clamp(22px, 5vw, 64px);
      font-weight: 500;
      letter-spacing: -.065em;
      line-height: 1.05;
      text-decoration: none;
      overflow-wrap: anywhere;
      transition: color .2s ease;
    }
    .footer-contact:hover { color: #e5b09f; }
    .footer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      max-width: 1500px;
      margin: clamp(32px, 6vw, 76px) auto 0;
      padding-top: 18px;
      border-top: 1px solid rgb(244 242 236 / 22%);
      color: rgb(244 242 236 / 68%);
    }
    .footer-note { font-size: 9px; }
    .footer-name { color: var(--bg); font-size: 12px; font-weight: 600; }
    .footer-credit { display: flex; align-items: center; gap: 14px; }

    @media (max-width: 760px) {
      .wrap { width: min(100% - 48px, 620px); }
      .site-header { min-height: 76px; }
      .hero-image { height: 100svh; min-height: 520px; }
      .projects { width: min(100% - 48px, 620px); padding-block: 44px 80px; }
      .project-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 18px; }
      .project-card, .project-card:nth-child(n) { grid-column: span 1; }
      .project-card:nth-child(1) { grid-column: span 2; }
      .project-card:nth-child(1) .project-image { aspect-ratio: 1.5; }
      .project-card:nth-child(2) .project-image { aspect-ratio: 1.32; }
    }
    @media (max-width: 480px) {
      .wrap { width: calc(100% - 36px); }
      .wordmark-name { font-size: 12px; }
      .wordmark-caption { font-size: 8px; }
      .nav-link { gap: 7px; font-size: 11px; }
      .site-header { padding-inline: 18px; }
      .hero-image { height: 100svh; min-height: 480px; }
      .projects { width: calc(100% - 36px); padding-top: 32px; }
      .project-grid { grid-template-columns: 1fr; gap: 28px; }
      .project-card, .project-card:nth-child(n) { grid-column: 1; }
      .project-card:nth-child(n) .project-image { aspect-ratio: 1.25; }
      .project-title { font-size: 22px; }
      .site-footer { padding: 34px 18px 20px; }
      .footer-topline { margin-bottom: 18px; }
      .footer-contact { gap: 8px; letter-spacing: -.07em; }
      .footer-bottom { align-items: flex-start; flex-direction: column; gap: 12px; margin-top: 36px; }
      .footer-credit { align-items: flex-start; flex-direction: column; gap: 4px; }
    }
    @media (max-width: 340px) {
      .wordmark-name { font-size: 10px; letter-spacing: .1em; }
      .wordmark-caption { font-size: 7px; }
      .nav-link { gap: 4px; font-size: 10px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-delay: 0ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Saltar al contenido</a>
  <header class="site-header">
    <a class="wordmark" href="index.html" aria-label="Patricia Nieto, inicio">
      <span class="wordmark-name">PATRICIA NIETO</span>
      <span class="wordmark-caption">Fotografía + vídeo</span>
    </a>
    <nav class="site-nav" aria-label="Navegación principal">
      <a class="nav-link" href="#proyectos">Proyectos</a>
      <a class="nav-link" href="#contacto">Contacto</a>
    </nav>
  </header>

  <main id="main">
    <section class="hero" aria-label="Fotografía de portada">
      <div class="hero-image">
        <img class="hero-slide is-active" src="img/Tiffany_063.jpg" alt="Composición floral de Tiffany &amp; Co. fotografiada por Patricia Nieto" fetchpriority="high" />
        <img class="hero-slide" alt="" aria-hidden="true" />
        <h1 class="visually-hidden">Fotografía y vídeo de Patricia Nieto</h1>
      </div>
    </section>

    <section class="projects wrap" id="proyectos" aria-label="Secciones de trabajo">
      <div class="project-grid">
        <a class="project-card" href="espacios.html">
          <div class="project-image">
            <img src="img/7P9A4410.jpg" alt="Luz y arquitectura en un espacio interior" loading="lazy" />
          </div>
          <div class="project-details"><span class="project-title">Espacios</span><span class="project-arrow" aria-hidden="true">↗</span></div>
        </a>
        <a class="project-card" href="boda.html">
          <div class="project-image">
            <img src="img/7P9A3878.jpg" alt="Instante de una boda" loading="lazy" />
          </div>
          <div class="project-details"><span class="project-title">Bodas</span><span class="project-arrow" aria-hidden="true">↗</span></div>
        </a>
        <a class="project-card" href="corporativo.html">
          <div class="project-image">
            <img src="img/BritChamber_PatriciaNieto_181.jpg" alt="Retrato durante un evento corporativo" loading="lazy" />
          </div>
          <div class="project-details"><span class="project-title">Corporativo</span><span class="project-arrow" aria-hidden="true">↗</span></div>
        </a>
        <a class="project-card" href="producto.html">
          <div class="project-image">
            <img src="img/IMG_3514.jpg" alt="Cóctel fotografiado para un proyecto de producto" loading="lazy" />
          </div>
          <div class="project-details"><span class="project-title">Producto</span><span class="project-arrow" aria-hidden="true">↗</span></div>
        </a>
        <a class="project-card" href="video.html">
          <div class="project-image">
            <img src="videos/posters/InPost_Atletico.jpg" alt="Fotograma de un proyecto de vídeo" loading="lazy" />
          </div>
          <div class="project-details"><span class="project-title">Vídeo</span><span class="project-arrow" aria-hidden="true">↗</span></div>
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="contacto">
    <div class="footer-topline">
      <span>Contacto</span>
    </div>
    <a class="footer-contact" href="mailto:patricianieto2.0@gmail.com">
      <span>patricianieto2.0@gmail.com</span>
    </a>
    <div class="footer-bottom">
      <span class="footer-name">Patricia Nieto</span>
      <div class="footer-credit">
        <span class="footer-note">© <span id="year">2026</span> · Fotografía + vídeo</span>
      </div>
    </div>
  </footer>
  <script>
    const siteHeader = document.querySelector('.site-header');
    const updateHeaderAppearance = () => {
      siteHeader.classList.toggle('is-scrolled', window.scrollY > 48);
    };

    updateHeaderAppearance();
    window.addEventListener('scroll', updateHeaderAppearance, { passive: true });

    const heroSlides = [
      {
        src: 'img/Tiffany_063.jpg',
        alt: 'Composición floral de Tiffany & Co. fotografiada por Patricia Nieto'
      },
      {
        src: 'img/InesUrquijo_elViajero_2025_066.jpg',
        alt: 'Interior de El Viajero fotografiado por Patricia Nieto'
      },
      {
        src: 'img/7P9A3878.jpg',
        alt: 'Instante de una boda fotografiado por Patricia Nieto'
      },
      {
        src: 'img/BritChamber_PatriciaNieto_181.jpg',
        alt: 'Evento corporativo fotografiado por Patricia Nieto'
      },
      {
        src: 'img/IMG_3514.jpg',
        alt: 'Cóctel fotografiado para un proyecto de producto'
      }
    ];
    const heroImages = document.querySelectorAll('.hero-slide');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
    let currentSlide = 0;
    let activeImage = heroImages[0];
    let heroSlideTimer;

    function showNextHeroSlide() {
      if (reduceMotion.matches) return;

      const nextSlide = (currentSlide + 1) % heroSlides.length;
      const preload = new Image();
      preload.onload = () => {
        const nextImage = activeImage === heroImages[0] ? heroImages[1] : heroImages[0];
        nextImage.src = heroSlides[nextSlide].src;
        nextImage.alt = heroSlides[nextSlide].alt;
        nextImage.removeAttribute('aria-hidden');
        activeImage.setAttribute('aria-hidden', 'true');
        activeImage.classList.remove('is-active');
        nextImage.classList.add('is-active');
        activeImage = nextImage;
        currentSlide = nextSlide;
        scheduleNextHeroSlide();
      };
      preload.onerror = () => {
        console.error(`No se pudo cargar la imagen de portada: ${heroSlides[nextSlide].src}`);
        scheduleNextHeroSlide();
      };
      preload.src = heroSlides[nextSlide].src;
    }

    function scheduleNextHeroSlide() {
      window.clearTimeout(heroSlideTimer);
      if (!reduceMotion.matches) {
        heroSlideTimer = window.setTimeout(showNextHeroSlide, 6500);
      }
    }

    reduceMotion.addEventListener('change', scheduleNextHeroSlide);
    scheduleNextHeroSlide();
  </script>
</body>
</html>
