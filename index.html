    <style>
     :root {
  --bg:         #090909;
  --border:     #1e1e1e;
  --text:       #ddd8ce;
  --muted:      #444;
  --accent:     #b8a47a;
  --accent-dim: #5a4e30;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inconsolata', monospace;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
}

/* ── Header ─────────────────────────────────────────── */
header {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 64px 32px 24px;
  text-align: center;
}

.logo-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(32px, 6vw, 52px);
  font-weight: 300;
  letter-spacing: 0.35em;
  line-height: 1;
  animation: fadeUp 0.7s ease both;
}

.logo-sub {
  margin-top: 14px;
  font-size: 10px;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--muted);
  animation: fadeUp 0.7s ease 0.1s both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── Rule under header ─────────────────────────────── */
.hairline {
  width: 1px;
  height: 48px;
  background: var(--border);
  margin: 8px auto 0;
}

/* ── Sections grid ──────────────────────────────────── */
main {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
}

@media (max-width: 1000px) {
  main { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
  main { grid-template-columns: 1fr; }
}

.section-link {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 42vh;
  border-top: 1px solid var(--border);
  border-left: 1px solid var(--border);
  text-decoration: none;
  color: var(--text);
  overflow: hidden;
  animation: fadeUp 0.7s ease both;
}

/* Desktop: 5 columnas → sin borde izq. en el 1º de cada fila */
main .section-link:nth-child(5n+1) { border-left: none; }

/* Tablet: 2 columnas → sin borde izq. en impares, sin borde arriba en los 2 primeros */
@media (max-width: 1000px) {
  main .section-link:nth-child(5n+1) { border-left: 1px solid var(--border); }
  main .section-link:nth-child(2n+1) { border-left: none; }
  main .section-link:nth-child(-n+2) { border-top: none; }
}

/* Móvil: 1 columna → sin bordes izq., sin borde arriba en el primero */
@media (max-width: 560px) {
  main .section-link { border-left: none !important; border-top: 1px solid var(--border); }
  main .section-link:first-child { border-top: none; }
}

.section-link:nth-child(1) { animation-delay: 0.15s; }
.section-link:nth-child(2) { animation-delay: 0.22s; }
.section-link:nth-child(3) { animation-delay: 0.29s; }
.section-link:nth-child(4) { animation-delay: 0.36s; }
.section-link:nth-child(5) { animation-delay: 0.43s; }

.section-bg {
  position: absolute;
  inset: 0;
  background: #111;
  opacity: 0.55;
  transition: opacity 0.5s ease, transform 0.7s ease;
  filter: grayscale(40%);
}
.section-link:hover .section-bg {
  opacity: 0.85;
  transform: scale(1.05);
  filter: grayscale(0%);
}

.section-veil {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(9,9,9,0.9) 0%, rgba(9,9,9,0.35) 60%, rgba(9,9,9,0.55) 100%);
}

.section-content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  transition: transform 0.4s ease;
}
.section-link:hover .section-content { transform: translateY(-4px); }

.section-index {
  font-size: 10px;
  letter-spacing: 0.3em;
  color: var(--accent);
}

.section-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(22px, 2.6vw, 32px);
  font-style: italic;
  font-weight: 300;
}

.section-line {
  width: 0;
  height: 1px;
  background: var(--accent-dim);
  transition: width 0.4s ease;
}
.section-link:hover .section-line { width: 40px; }

.section-desc {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--muted);
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.section-link:hover .section-desc {
  opacity: 1;
  transform: translateY(0);
}

/* ── Footer ─────────────────────────────────────────── */
footer {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  border-top: 1px solid var(--border);
  font-size: 9px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
}
    </style>
