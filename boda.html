<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Patricia Nieto — Boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />

<style>
/* ── Variables ───────────────────────────────────────────── */
:root {
  --bg:         #f4f2ec;
  --surface:    #e9e6dd;
  --border:     #d8d5cc;
  --text:       #252622;
  --muted:      #77786f;
  --accent:     #b44f34;
  --accent-dim: #8f3d2a;
  --cols: 3;
}

/* ── Reset ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ──────────────────────────────────────────────── */
header {
  position: sticky;
  top: 0;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: min(1380px, calc(100% - 112px));
  height: 88px;
  margin-inline: auto;
  padding: 0;
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.logo {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  text-decoration: none;
}

.logo-name {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.13em;
  line-height: 1;
  white-space: nowrap;
  color: var(--text);
  text-decoration: none;
}

.logo-name:hover,
.logo-name:visited,
.logo-name:active {
  color: var(--text);
  text-decoration: none;
}

@media (max-width: 520px) {
  .logo-name {
    font-size: 12px;
    letter-spacing: 0.1em;
  }
}

.logo-sub {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.back-link {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  color: var(--text);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-decoration: none;
  text-transform: uppercase;
  transition: color 0.2s ease;
}
.back-link:hover { color: var(--accent); }
.back-link span { color: var(--accent); font-size: 16px; }

@media (max-width: 760px) { header { width: calc(100% - 48px); } }
@media (max-width: 480px) {
  header { width: calc(100% - 36px); height: 76px; }
  .logo-sub { font-size: 7px; }
  .back-link { gap: 5px; font-size: 8px; letter-spacing: 0.08em; }
}

/* ── Filters ─────────────────────────────────────────────── */
.filters {
  display: flex;
  gap: 2px;
}

.filter-btn {
  background: none;
  border: 1px solid transparent;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 6px 14px;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
}
.filter-btn:hover         { color: var(--text); border-color: var(--border); }
.filter-btn.active        { color: var(--accent); border-color: var(--accent-dim); }

/* ── Grid ────────────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), minmax(0, 1fr));
  gap: clamp(12px, 1.8vw, 24px);
  width: min(1500px, calc(100% - 112px));
  margin: 0 auto;
  padding: clamp(28px, 4vw, 56px) 0;
}

@media (max-width: 900px) { :root { --cols: 2; } }
@media (max-width: 760px) { .grid { width: calc(100% - 48px); } }
@media (max-width: 520px) {
  :root { --cols: 1; }
  .grid { width: calc(100% - 36px); gap: 18px; padding-top: 24px; }
}

/* ── Grid item ───────────────────────────────────────────── */
.grid-item {
  position: relative;
  aspect-ratio: 4/3;
  overflow: hidden;
  cursor: pointer;
  background: var(--surface);

  animation: fadeUp 0.45s ease both;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(12px); }
  to   { opacity: 1; transform: translateY(0); }
}

.grid-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.5s ease;
}

.grid-item:hover img {
  transform: scale(1.04);
  filter: none;
}

/* Overlay */
.grid-overlay {
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(20, 20, 18, 0.72) 0%, rgba(20, 20, 18, 0.05) 65%, transparent 100%);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  gap: 3px;
  padding: 14px 12px;
  opacity: 1;
  transition: opacity 0.3s ease;
}
.grid-item:hover .grid-overlay { opacity: 1; }

.item-title {
  font-family: 'DM Serif Display', serif;
  font-size: 17px;
  font-style: italic;
  font-weight: 300;
  color: #fff;
  line-height: 1.2;
}
.item-cat {
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--accent);
}

/* ── Lightbox ─────────────────────────────────────────────── */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.lightbox.open {
  opacity: 1;
  pointer-events: all;
}

.lb-bg {
  position: absolute;
  inset: 0;
  background: rgba(25, 25, 23, 0.94);
  backdrop-filter: blur(6px);
  cursor: pointer;
}

.lb-img-wrap {
  position: relative;
  z-index: 1;
  max-width: 90vw;
  max-height: 86dvh;
}

.lb-img {
  max-width: 100%;
  max-height: 86dvh;
  object-fit: contain;
  display: block;
  opacity: 0;
  transition: opacity 0.3s ease;
}
.lb-img.show { opacity: 1; }

/* Nav buttons */
.lb-btn {
  position: fixed;
  top: 50%;
  transform: translateY(-50%);
  z-index: 2;
  background: none;
  border: 1px solid rgba(244, 242, 236, 0.35);
  color: var(--bg);
  width: 46px;
  height: 46px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
  font-size: 18px;
}
.lb-btn:hover { color: #fff; border-color: var(--accent); background: var(--accent); }
.lb-prev { left: 20px; }
.lb-next { right: 20px; }

.lb-close {
  position: fixed;
  top: 20px; right: 20px;
  z-index: 2;
  background: none;
  border: 1px solid rgba(244, 242, 236, 0.35);
  color: var(--bg);
  width: 38px; height: 38px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: color 0.2s, border-color 0.2s;
  font-size: 16px;
}
.lb-close:hover { color: #fff; border-color: var(--accent); background: var(--accent); }

/* Info bar */
.lb-info {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2;
  display: flex;
  align-items: baseline;
  gap: 18px;
  white-space: nowrap;
}
.lb-info-cat   { font-size: 9px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); }
.lb-info-title { color: var(--bg); font-family: 'DM Serif Display', serif; font-size: 18px; font-style: italic; font-weight: 300; }
.lb-info-count { color: rgba(244, 242, 236, 0.7); font-size: 10px; letter-spacing: 0.1em; }
</style>
</head>
<body>

<header>
<div class="logo">
    <a class="logo-name" href="index.html">PATRICIA NIETO</a>
    <span class="logo-sub">Fotografía + vídeo</span>
  </div>
<div class="filters" id="filters" style="display:none"></div>
<a class="back-link" href="index.html#proyectos">Volver a proyectos <span aria-hidden="true">↗</span></a>
</header>

<main class="grid" id="grid"></main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <div class="lb-bg" id="lb-bg"></div>
  <button class="lb-btn lb-prev" id="lb-prev">&#8592;</button>
  <div class="lb-img-wrap">
    <img class="lb-img" id="lb-img" src="" alt="" />
  </div>
  <button class="lb-btn lb-next" id="lb-next">&#8594;</button>
  <button class="lb-close" id="lb-close">&#10005;</button>
  <div class="lb-info">
    <span class="lb-info-cat"  id="lb-cat"></span>
    <span class="lb-info-title" id="lb-title"></span>
    <span class="lb-info-count" id="lb-count"></span>
  </div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────
// Cambia estas URLs por las tuyas. Cada foto tiene:
//   src   → imagen grande (lightbox)
//   thumb → imagen pequeña (grid)
const PHOTOS = [

  { id:1,  title:'Eventos',    category:'boda',   thumb:'img/7P9A1917.jpg' ,  src:'img/7P9A1917.jpg' },
  { id:2,  title:'Eventos',    category:'boda',   thumb:'img/7P9A2219.jpg' ,  src:'img/7P9A2219.jpg' },
  { id:3,  title:'Eventos',    category:'boda',   thumb:'img/7P9A2246.jpg' ,  src:'img/7P9A2246.jpg' },
  { id:4,  title:'Eventos',    category:'boda',   thumb:'img/7P9A2440.jpg' ,  src:'img/7P9A2440.jpg' },
  { id:5,  title:'Eventos',    category:'boda',   thumb:'img/7P9A2553.jpg' ,  src:'img/7P9A2553.jpg' },
  { id:6,  title:'Eventos',    category:'boda',   thumb:'img/7P9A2798.jpg' ,  src:'img/7P9A2798.jpg' },
  { id:7,  title:'Eventos',    category:'boda',   thumb:'img/7P9A3005.jpg' ,  src:'img/7P9A3005.jpg' },
  { id:8,  title:'Eventos',    category:'boda',   thumb:'img/2U2A1902 copia.jpg' ,  src:'img/2U2A1902 copia.jpg' },
  { id:9,  title:'Eventos',    category:'boda',   thumb:'img/2U2A1913 copia.jpg' ,  src:'img/2U2A1913 copia.jpg' },
  { id:10, title:'Eventos',    category:'boda',   thumb:'img/2U2A2343 copia.jpg' ,  src:'img/2U2A2343 copia.jpg' },
  { id:11, title:'Eventos',    category:'boda',   thumb:'img/2U2A2521 copia.jpg' ,  src:'img/2U2A2521 copia.jpg' },
  { id:12, title:'Eventos',    category:'boda',   thumb:'img/7P9A1658.jpg' ,  src:'img/7P9A1658.jpg' },
  { id:13, title:'Eventos',    category:'boda',   thumb:'img/7P9A1740.jpg' ,  src:'img/7P9A1740.jpg' },
  { id:14, title:'Eventos',    category:'boda',   thumb:'img/7P9A3425.jpg' ,  src:'img/7P9A3425.jpg' },
  { id:15, title:'Eventos',    category:'boda',   thumb:'img/7P9A3534.jpg' ,  src:'img/7P9A3534.jpg' },
  { id:16, title:'Eventos',    category:'boda',   thumb:'img/7P9A3878.jpg' ,  src:'img/7P9A3878.jpg' },
  { id:17, title:'Eventos',    category:'boda',   thumb:'img/7P9A4134.jpg' ,  src:'img/7P9A4134.jpg' },
  { id:18, title:'Eventos',    category:'boda',   thumb:'img/7P9A4688.jpg' ,  src:'img/7P9A4688.jpg' },
  { id:19, title:'Eventos',    category:'boda',   thumb:'img/Ines_Las Fraguas_244.jpg' ,  src:'img/Ines_Las Fraguas_244.jpg' },
  { id:20, title:'Eventos',    category:'boda',   thumb:'img/Ines_Las Fraguas_267.jpg' ,  src:'img/Ines_Las Fraguas_267.jpg' },
  { id:21, title:'Eventos',    category:'boda',   thumb:'img/Ines_Las Fraguas_391.jpg' ,  src:'img/Ines_Las Fraguas_391.jpg' }


];

// ── State ─────────────────────────────────────────────────────────
let activeCategory = 'all';
let filtered = [...PHOTOS];
let lbIndex = 0;
let lbOpen = false;
let touchStartX = 0;
let wheelLock = false;

// ── DOM refs ──────────────────────────────────────────────────────
const grid      = document.getElementById('grid');
const filtersEl = document.getElementById('filters');
const lightbox  = document.getElementById('lightbox');
const lbImg     = document.getElementById('lb-img');
const lbBg      = document.getElementById('lb-bg');
const lbPrev    = document.getElementById('lb-prev');
const lbNext    = document.getElementById('lb-next');
const lbClose   = document.getElementById('lb-close');
const lbCat     = document.getElementById('lb-cat');
const lbTitle   = document.getElementById('lb-title');
const lbCount   = document.getElementById('lb-count');

// ── IntersectionObserver (lazy loading) ───────────────────────────
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (!entry.isIntersecting) return;
    const img = entry.target;
    const src = img.dataset.src;
    if (!src) return;
    img.src = src;
    img.removeAttribute('data-src');
    observer.unobserve(img);
  });
}, { rootMargin: '200px' });

// ── Render grid ───────────────────────────────────────────────────
function renderGrid(photos) {
  grid.innerHTML = '';
  photos.forEach((photo, i) => {
    const item = document.createElement('div');
    item.className = 'grid-item';
    item.style.animationDelay = `${i * 50}ms`;

    const img = document.createElement('img');
    img.dataset.src = photo.thumb;
    img.alt = photo.title;
    // placeholder SVG transparente
    img.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E";
    observer.observe(img);

    const overlay = document.createElement('div');
    overlay.className = 'grid-overlay';
    overlay.innerHTML = `
      <span class="item-title">${photo.title}</span>
      <span class="item-cat">${photo.category}</span>
    `;

    item.appendChild(img);
    item.appendChild(overlay);
    item.addEventListener('click', () => openLightbox(i));
    grid.appendChild(item);
  });
}

// ── Filters ───────────────────────────────────────────────────────
const categories = ['all', 'shop', 'deco', 'casa', 'obra', 'nave'];

function renderFilters() {
  filtersEl.innerHTML = '';
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === activeCategory ? ' active' : '');
    btn.textContent = cat === 'all' ? 'All' : cat[0].toUpperCase() + cat.slice(1);
    btn.addEventListener('click', () => {
      if (cat === activeCategory) return;
      activeCategory = cat;
      filtered = cat === 'all' ? [...PHOTOS] : PHOTOS.filter(p => p.category === cat);
      renderFilters();
      renderGrid(filtered);
    });
    filtersEl.appendChild(btn);
  });
}

// ── Lightbox ──────────────────────────────────────────────────────
function openLightbox(index) {
  lbIndex = index;
  lbOpen = true;
  document.body.style.overflow = 'hidden';
  lightbox.classList.add('open');
  loadLbPhoto();
}

function closeLightbox() {
  lbOpen = false;
  lightbox.classList.remove('open');
  document.body.style.overflow = '';
}

function navigate(dir) {
  lbIndex = (lbIndex + dir + filtered.length) % filtered.length;
  loadLbPhoto();
}

function loadLbPhoto() {
  const photo = filtered[lbIndex];
  lbImg.classList.remove('show');

  const tmp = new Image();
  tmp.src = photo.src;
  tmp.onload = () => {
    lbImg.src = photo.src;
    lbImg.alt = photo.title;
    requestAnimationFrame(() => lbImg.classList.add('show'));
  };

  lbCat.textContent   = photo.category;
  lbTitle.textContent = photo.title;
  lbCount.textContent = `${lbIndex + 1} / ${filtered.length}`;
}

// ── Events ────────────────────────────────────────────────────────
lbBg.addEventListener('click', closeLightbox);
lbClose.addEventListener('click', closeLightbox);
lbPrev.addEventListener('click', () => navigate(-1));
lbNext.addEventListener('click', () => navigate(1));

document.addEventListener('keydown', e => {
  if (!lbOpen) return;
  if (e.key === 'Escape')      closeLightbox();
  if (e.key === 'ArrowRight')  navigate(1);
  if (e.key === 'ArrowLeft')   navigate(-1);
});

lightbox.addEventListener('wheel', e => {
  if (!lbOpen || wheelLock) return;
  e.preventDefault();
  if (Math.abs(e.deltaY) < 15) return;
  wheelLock = true;
  navigate(e.deltaY > 0 ? 1 : -1);
  setTimeout(() => { wheelLock = false; }, 380);
}, { passive: false });

lightbox.addEventListener('touchstart', e => {
  touchStartX = e.touches[0].clientX;
}, { passive: true });

lightbox.addEventListener('touchend', e => {
  if (!lbOpen) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) navigate(dx < 0 ? 1 : -1);
}, { passive: true });

// ── Init ──────────────────────────────────────────────────────────
renderFilters();
renderGrid(filtered);
</script>
</body>
</html>
